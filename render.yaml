services:
  # Backend Web Service
  - type: web
    name: smart-attendance-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-attendance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          name: smart-attendance-frontend
          type: web
          property: url
      - key: UPLOAD_PATH
        value: ./uploads
      - key: TWO_FACTOR_ENABLED
        value: "false"

  # Frontend Static Site
  - type: web
    name: smart-attendance-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: smart-attendance-backend
          type: web
          property: url

databases:
  - name: smart-attendance-db
    plan: free
